[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supergit"
version = "2.0.0"
description = "AI-powered Git commit assistant with Groq Map-Reduce analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SuperGit" }]
keywords = ["git", "ai", "commits", "groq", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    "groq>=0.9.0",
    "watchdog>=4.0.0",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
    "gitpython>=3.1.40",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
supergit = "src.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
